<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Student IT Association</title>
</head>
<body>

    <header>
        <h1>Student IT Association</h1>
        <nav>
            <a href="#">About</a> | <a href="#">Join</a>
        </nav>
    </header>

    <main>
        <section>
            <h2>Organization Info</h2>
            <p>We are a <strong>technology</strong> organization.</p>
        </section>

        <section>
            <h2>Requirements</h2>
            <ul>
                <li>Be a student</li>
                <li>Love coding</li>
                <li>Attend meetings</li>
            </ul>
        </section>

        <section>
            <h2>Featured Video & Logo</h2>
            <!-- Updated with your new youtube-nocookie.com iframe -->
<iframe width="560" height="315" src="https://www.youtube.com/embed/4dKCiwVK9_w?si=SFKHXTogZk7FFaVF" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>        </section>

        <section>
            <h2>Registration Form</h2>
            <form action="#">
                <label for="fname">Full Name:</label>
                <input type="text" id="fname" required><br><br>
                
                <label for="email">Email Address:</label>
                <input type="email" id="email" placeholder="student@mapua.edu.ph" required><br><br>
                
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob"><br><br>
                
                <label for="year">Year Level:</label>
                <input type="number" id="year" min="1" max="5"><br><br>
                
                <button type="submit">Submit</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Student IT Association</p>
    </footer>

</body>
</html>
